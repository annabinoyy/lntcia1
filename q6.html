
<!DOCTYPE html>
<html>
<head>
    <title>Fetch API Example</title>
</head>
<body>

    <h2>Fetch User Details</h2>

    <script>
        fetch("https://jsonplaceholder.typicode.com/users/1")
            .then(response => response.json())
            .then(data => {
                console.log(data.name);
            })
            .catch(error => {
                console.log("Error:", error);
            });
    </script>

</body>
</html>
